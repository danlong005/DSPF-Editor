<head>
  <script src="{elements}" type="module"></script>
  <script src="{konva}"></script>
  <script src="{main}"></script>
  <link rel="stylesheet" href="{styles}">
  <link rel="stylesheet" href="{codicon}" id="vscode-codicon-stylesheet">
</head>

<!-- https://vscode-elements.github.io/guides/getting-started/ -->

<body style="padding: 0em;">
  <div>
    <!-- A tab strip doesn't scale to files with many record formats - can't
         see them all, and long names get clipped. A filterable dropdown scrolls
         and can be typed into instead. -->
    <div style="padding: 0.5em 1em; display: flex; align-items: center; gap: 0.5em; border-bottom: 1px solid var(--vscode-editorGroup-border);">
      <vscode-label for="recordFormatSelect">Record Format:</vscode-label>
      <div id="recordFormatSelector" style="flex: 1; max-width: 24em;"></div>
      <vscode-button id="newFormatButton" icon="add" secondary title="Add a new record format">New Format</vscode-button>
      <!-- Hidden until "New Format" is clicked. -->
      <div id="newFormatForm" style="display: none; align-items: center; gap: 0.5em;">
        <vscode-textfield id="newFormatName" placeholder="Format name" style="width: 12em;"></vscode-textfield>
        <vscode-button id="newFormatConfirm" icon="check" title="Create">Create</vscode-button>
      </div>
      <!-- Only shown when DSPSIZ defines more than one size (e.g. *DS3 and *DS4 together). -->
      <div id="dspSizeToggle" style="display: none;"></div>
    </div>

    <div style="display: flex; height: calc(100vh - 3em);">
      <!-- Left Sidebar -->
      <div style="width: 20%; background-color: var(--vscode-sideBar-background); overflow-y: auto;">
        <div id="recordFormatSidebar">
        </div>
      </div>

      <!-- Main Content -->
      <div style="flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 2em; overflow: auto;">
        <div id="containerFrame" style="border: 1px solid var(--vscode-editorGroup-border); border-radius: 4px; padding: 1px; background: var(--vscode-editor-background); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);">
          <div id="container"></div>
        </div>
      </div>

      <!-- Right Sidebar -->
      <div style="width: 20%; background-color: var(--vscode-sideBar-background); overflow-y: auto;">
        <div id="fieldInfoSidebar">
        </div>
        <!-- Both field- and format-level keyword trees now live in this same
             right panel (as tabs), so their shared "add/edit keyword" form
             belongs here too, not off in the left sidebar. -->
        <div id="keywordEditorArea">
        </div>
      </div>
    </div></div>

  </div>
</body>
