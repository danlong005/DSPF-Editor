name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build and publish VSIX release
    runs-on: ubuntu-latest
    # Only run in this repo, not if this workflow file ever ends up merged
    # into an upstream/other fork - releases here shouldn't happen elsewhere.
    if: github.repository == 'danlong005/vscode-ibmi-renderer'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm test

      - name: Package extension
        run: npx @vscode/vsce package

      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - skipping. Bump the version in package.json to publish a new release."
            exit 0
          fi
          gh release create "$TAG" *.vsix \
            --repo "$GITHUB_REPOSITORY" \
            --title "DSPF Editor $TAG" \
            --generate-notes
